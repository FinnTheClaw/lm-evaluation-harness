dataset_path: SaylorTwift/bbh
output_type: generate_until
test_split: test
doc_to_text: "Q: {{input}}\nA: Let's think step by step."
doc_to_target: "{{target}}"
target_delimiter: ""
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    filter_list:
      - name: "get-answer"
generation_kwargs:
  max_gen_toks: 1024
  until:
    - "Q:"
    - "\n\nQ"
  do_sample: false
  temperature: 0.0
filter_list:
  - name: "get-answer"
    filter:
      - function: "regex"
        regex_pattern: "(?<=the answer is )(.*)(?=.)"
      - function: "take_first"
num_fewshot: 3
fewshot_config:
  sampler: first_n
metadata:
  version: 1.0
