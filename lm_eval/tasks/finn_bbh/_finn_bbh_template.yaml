dataset_path: SaylorTwift/bbh
output_type: generate_until
test_split: test
# IMPORTANT: do NOT change doc_to_text, target_delimiter, or generation_kwargs without
# clearing lm-eval-cache first — prompt hash changes invalidate all 2400 cached responses.
# The kimi_bbh filter handles extraction from bare outputs; prompt format change is not needed.
doc_to_text: "Q: {{input}}\nA: Provide the final answer directly."
doc_to_target: "{{target}}"
target_delimiter: ""
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    filter_list:
      - name: "get-answer"
generation_kwargs:
  max_gen_toks: 1024
  until:
    - "Q:"
    - "\n\nQ"
  do_sample: false
  temperature: 0.0
filter_list:
  - name: "get-answer"
    filter:
      - function: "kimi_bbh"
num_fewshot: 3
fewshot_config:
  sampler: first_n
metadata:
  version: 1.0
  changelog: "v1.0 original — kimi_bbh filter added 2026-05-04 (replaces broken regex)"
