# finn_arc_easy — generate_until wrapper for ARC-Easy
task: finn_arc_easy
dataset_path: allenai/ai2_arc
dataset_name: ARC-Easy
output_type: generate_until
training_split: train
validation_split: validation
test_split: test
doc_to_text: "The following is a multiple choice science question. Think through it step by step, then conclude your response with exactly: 'The best answer is X.' where X is A, B, C, or D.\n\nQuestion: {{question}}\n{% for i in range(choices.label|length) %}{{choices.label[i]}}. {{choices.text[i]}}\n{% endfor %}\n\nThe best answer is"
doc_to_target: "{{answerKey}}"
generation_kwargs:
  do_sample: false
  temperature: 0
  max_gen_toks: 4096
  until:
    - "\n\nQuestion:"
    - "\n\nThe following"
    - "\n\nWhat is"
filter_list:
  - name: flexible_extract
    filter:
      - function: "regex"
        regex_pattern: "(?:best answer is|answer is|the answer is|therefore[:\\s]+|thus[:\\s]+|answer[:\\s]+)\\s*[\\(\\[]?([A-D])(?:[\\)\\].,\\s]|$)"
        group_select: -1
      - function: "regex"
        regex_pattern: "\\*\\*([A-D])\\*\\*|^([A-D])[.):,\\s]|\\(([A-D])\\)\\s*$"
        group_select: -1
      - function: "regex"
        regex_pattern: "([A-D])(?:\\)|\\.|,|\\s|$)(?=[^A-D]*$)"
        group_select: -1
      - function: take_first
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true
num_fewshot: 0
metadata:
  version: 1.0
