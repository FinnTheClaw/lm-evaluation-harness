task: finn_musr_team_allocation
dataset_path: TAUR-Lab/MuSR
output_type: generate_until
test_split: team_allocation
doc_to_text: !function utils.doc_to_text_finn
doc_to_target: !function utils.doc_to_target_finn
generation_kwargs:
  do_sample: false
  temperature: 0
  max_gen_toks: 16384
  until: []
filter_list:
  - name: flexible_extract
    filter:
      - function: "regex"
        regex_pattern: "(?:best answer is|answer is|the answer is|therefore[:\\s]+|thus[:\\s]+|answer[:\\s]+)\\s*[\\(\\[]?([A-D])(?:[\\)\\].,\\s]|$)"
        group_select: -1
      - function: take_first
  - name: last_letter
    filter:
      - function: "regex"
        regex_pattern: "([A-D])(?:[\\)\\].,\\s]|$)"
        group_select: -1
      - function: take_first
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true
num_fewshot: 0
metadata:
  version: 2.0
